<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="хонисаклер - дискография, синглы и ссылки">
    <title>хонисаклер</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<main class="page">
    <header class="header">
        <h1>хонисаклер</h1>
    </header>

    <section class="discography">
        <div class="album-list">
            <h2>дискография</h2>
            <div id="album-list"></div>
        </div>

        <div class="album-info" id="album-info">
            <h2 id="album-title"></h2>
            <p id="album-meta"></p>
            <img class="album-cover" id="album-cover" src="" alt="">
            <div class="album-links" id="album-links"></div>
        </div>

        <div class="track-list" id="track-list"></div>
    </section>

    <section class="singles">
        <h2>синглы</h2>
        <div id="singles-list"></div>
    </section>

    <section class="bottom">
        <div class="links">
            <h2>ссылки</h2>
            <div id="social-links"></div>
        </div>
    </section>
</main>
<script src="script.js?v=2"></script>
</body>
</html>
